<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Binance Square Autopost</title>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#0b0e11;color:#eaecef}header{padding:18px 24px;background:#181a20;border-bottom:1px solid #2b3139;display:flex;justify-content:space-between;align-items:center}h1{font-size:20px;margin:0;color:#f0b90b}.wrap{padding:22px;display:grid;grid-template-columns:360px 1fr;gap:18px}.card{background:#181a20;border:1px solid #2b3139;border-radius:12px;padding:16px}label{display:block;font-size:12px;color:#b7bdc6;margin-top:12px}input,textarea,select{width:100%;box-sizing:border-box;background:#0b0e11;color:#eaecef;border:1px solid #3c4450;border-radius:8px;padding:9px;margin-top:5px}textarea{min-height:310px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}button{background:#f0b90b;color:#111;border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer}button.secondary{background:#2b3139;color:#eaecef}button.danger{background:#d64545;color:white}.muted{color:#848e9c;font-size:12px}.pill{display:inline-block;padding:3px 8px;border-radius:999px;background:#2b3139;margin-right:6px}.ok{color:#0ecb81}.bad{color:#f6465d}pre{white-space:pre-wrap;background:#0b0e11;border:1px solid #2b3139;border-radius:8px;padding:12px;max-height:300px;overflow:auto}.run{border-bottom:1px solid #2b3139;padding:10px 0}.run:last-child{border-bottom:0}.post{font-size:15px;line-height:1.6;color:#f5f5f5}@media(max-width:900px){.wrap{grid-template-columns:1fr}}
  </style>
</head>
<body>
<header><h1>Binance Square Autopost</h1><div class="muted" id="clock"></div></header>
<div class="wrap">
  <section class="card">
    <h2>控制台</h2>
    <label>Admin Token</label><input id="token" placeholder="如果服务配置了 ADMIN_TOKEN，在这里填" />
    <div style="height:10px"></div>
    <div id="status" class="muted">加载中...</div>
    <label><input type="checkbox" id="enabled" style="width:auto"> 启用定时发布</label>
    <div class="row"><div><label>间隔分钟</label><input id="intervalMinutes" type="number" min="1"></div><div><label>每日上限</label><input id="maxDailyPosts" type="number" min="1"></div></div>
    <div class="row"><div><label>最短字符</label><input id="minPostChars" type="number"></div><div><label>最长字符</label><input id="maxPostChars" type="number"></div></div>
    <label>LLM Provider</label><select id="llmProvider"><option value="mock">mock 本地测试</option><option value="openai">OpenAI-compatible</option></select>
    <label>OpenAI Base URL</label><input id="openaiBaseUrl" placeholder="https://api.openai.com/v1 或你的中转站 /v1">
    <label>OpenAI API Key（留空不修改，保存在 data/secrets.json）</label><input id="openaiApiKey" type="password" autocomplete="off" placeholder="sk-...">
    <label>模型</label><input id="openaiModel" placeholder="gpt-4.1-mini / gpt-4o-mini / 你的中转模型名">
    <div class="row"><div><label>Temperature</label><input id="openaiTemperature" type="number" min="0" max="2" step="0.1"></div><div><label>Max Tokens</label><input id="openaiMaxTokens" type="number" min="1"></div></div>
    <label>Timeout ms</label><input id="openaiTimeoutMs" type="number" min="5000" step="1000">
    <label>Binance Square Key（留空不修改，保存在 data/secrets.json）</label><input id="binanceSquareOpenApiKey" type="password" autocomplete="off" placeholder="X-Square-OpenAPI-Key">
    <label>禁用币种（逗号分隔）</label><input id="bannedSymbols">
    <div style="height:14px"></div>
    <div class="row"><button onclick="saveSettings()">保存设置</button><button class="secondary" onclick="loadAll()">刷新</button></div>
    <div style="height:8px"></div>
    <div class="row"><button onclick="run('dry-run')">Dry-run</button><button class="danger" onclick="run('publish')">立即发布</button></div>
    <div style="height:8px"></div><button class="secondary" style="width:100%" onclick="marketPack()">预览 Market Pack</button>
  </section>
  <main>
    <section class="card">
      <h2>Prompt 编辑</h2>
      <div class="row"><select id="promptSelect" onchange="selectPrompt()"></select><button class="secondary" onclick="newPrompt()">新建</button><button onclick="savePrompt()">保存 Prompt</button><button class="secondary" onclick="activatePrompt()">设为启用</button></div>
      <label>名称</label><input id="promptName">
      <label>内容（可用变量：{{LEAD}}, {{PEER}}, {{ANCHOR}}, {{LEAD_CASHTAG}}, {{FACTS}}, {{TAKEAWAYS}}, {{MARKET_PACK_JSON}}）</label>
      <textarea id="promptContent"></textarea>
    </section>
    <section class="card" style="margin-top:18px">
      <h2>运行结果</h2>
      <pre id="output">等待操作...</pre>
    </section>
    <section class="card" style="margin-top:18px">
      <h2>最近运行</h2>
      <div id="runs"></div>
    </section>
  </main>
</div>
<script>
const $=id=>document.getElementById(id); let prompts=[];
$('token').value=localStorage.getItem('adminToken')||''; $('token').oninput=()=>localStorage.setItem('adminToken',$('token').value);
function headers(){const t=$('token').value;return {'Content-Type':'application/json',...(t?{Authorization:'Bearer '+t}:{})}}
async function api(path,opt={}){const r=await fetch(path,{...opt,headers:{...headers(),...(opt.headers||{})}});const j=await r.json();if(!r.ok||j.ok===false)throw new Error(j.error||r.statusText);return j}
function out(x){$('output').textContent=typeof x==='string'?x:JSON.stringify(x,null,2)}
async function loadAll(){try{await loadStatus();await loadPrompts();await loadRuns()}catch(e){out('加载失败：'+e.message)}}
async function loadStatus(){const j=await api('/api/status');const s=j.settings;$('status').innerHTML=`<span class="pill ${j.publisher.configured?'ok':'bad'}">Publisher ${j.publisher.configured?'OK':'未配置'}</span><span class="pill ${j.llm.apiKey?'ok':'bad'}">LLM Key ${j.llm.apiKey?'OK':'未配置'}</span><span class="pill">今日 ${j.counter.count}/${s.maxDailyPosts}</span><span class="pill">next ${j.scheduler.nextRunAt?new Date(j.scheduler.nextRunAt).toLocaleString():'-'}</span>`;$('enabled').checked=!!s.enabled;$('intervalMinutes').value=s.intervalMinutes;$('maxDailyPosts').value=s.maxDailyPosts;$('minPostChars').value=s.minPostChars;$('maxPostChars').value=s.maxPostChars;$('llmProvider').value=s.llmProvider;$('openaiBaseUrl').value=s.openaiBaseUrl||j.llm.baseUrl||'';$('openaiModel').value=s.openaiModel||j.llm.model||'';$('openaiTemperature').value=s.openaiTemperature??j.llm.temperature??0.8;$('openaiMaxTokens').value=s.openaiMaxTokens??j.llm.maxTokens??180;$('openaiTimeoutMs').value=s.openaiTimeoutMs??j.llm.timeoutMs??45000;$('openaiApiKey').value='';$('binanceSquareOpenApiKey').value='';$('bannedSymbols').value=(s.bannedSymbols||[]).join(',')}
async function saveSettings(){const body={enabled:$('enabled').checked,intervalMinutes:+$('intervalMinutes').value,maxDailyPosts:+$('maxDailyPosts').value,minPostChars:+$('minPostChars').value,maxPostChars:+$('maxPostChars').value,llmProvider:$('llmProvider').value,openaiBaseUrl:$('openaiBaseUrl').value.trim(),openaiModel:$('openaiModel').value.trim(),openaiTemperature:+$('openaiTemperature').value,openaiMaxTokens:+$('openaiMaxTokens').value,openaiTimeoutMs:+$('openaiTimeoutMs').value,bannedSymbols:$('bannedSymbols').value.split(',').map(x=>x.trim()).filter(Boolean)};const secretBody={};if($('openaiApiKey').value.trim())secretBody.openaiApiKey=$('openaiApiKey').value.trim();if($('binanceSquareOpenApiKey').value.trim())secretBody.binanceSquareOpenApiKey=$('binanceSquareOpenApiKey').value.trim();const result={settings:await api('/api/settings',{method:'PUT',body:JSON.stringify(body)})};if(Object.keys(secretBody).length)result.secrets=await api('/api/secrets',{method:'PUT',body:JSON.stringify(secretBody)});out(result);await loadStatus()}
async function loadPrompts(){const j=await api('/api/prompts');prompts=j.prompts;$('promptSelect').innerHTML=prompts.map(p=>`<option value="${p.id}">${p.active?'✅ ':''}${p.name}</option>`).join('');selectPrompt()}
function selectPrompt(){const p=prompts.find(x=>x.id===$('promptSelect').value)||prompts[0];if(!p)return;$('promptName').value=p.name;$('promptContent').value=p.content}
async function savePrompt(){const id=$('promptSelect').value;const body={name:$('promptName').value,content:$('promptContent').value};out(await api('/api/prompts/'+id,{method:'PUT',body:JSON.stringify(body)}));await loadPrompts()}
async function activatePrompt(){const id=$('promptSelect').value;out(await api('/api/prompts/'+id+'/activate',{method:'POST'}));await loadPrompts()}
async function newPrompt(){const body={name:'新 Prompt',content:$('promptContent').value,active:false};const j=await api('/api/prompts',{method:'POST',body:JSON.stringify(body)});out(j);await loadPrompts();$('promptSelect').value=j.prompt.id;selectPrompt()}
async function run(mode){if(mode==='publish'&&!confirm('确认立即发布到 Binance Square？'))return;out('运行中...');const j=await api('/api/run',{method:'POST',body:JSON.stringify({mode})});out(j);await loadAll()}
async function marketPack(){out('获取中...');out(await api('/api/market-pack',{method:'POST'}))}
async function loadRuns(){const j=await api('/api/runs?limit=30');$('runs').innerHTML=j.runs.map(r=>`<div class="run"><div><span class="pill ${r.status==='published'?'ok':r.status==='error'?'bad':''}">${r.status}</span><span class="muted">${r.createdAt||''} · ${r.source||''} · ${r.lead||''}/${r.peer||''}/${r.anchor||''}</span></div>${r.postText?`<div class="post">${escapeHtml(r.postText)}</div>`:''}${r.url?`<a href="${r.url}" target="_blank">${r.url}</a>`:''}${r.error?`<div class="bad">${escapeHtml(r.error)}</div>`:''}</div>`).join('')}
function escapeHtml(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
setInterval(()=>$('clock').textContent=new Date().toLocaleString(),1000);loadAll();
</script>
</body>
</html>
