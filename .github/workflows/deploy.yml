name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate required secrets
        run: |
          test -n "${{ secrets.VPS_HOST }}" || (echo "Missing secret: VPS_HOST" && exit 1)
          test -n "${{ secrets.VPS_USER }}" || (echo "Missing secret: VPS_USER" && exit 1)
          test -n "${{ secrets.VPS_SSH_KEY }}" || (echo "Missing secret: VPS_SSH_KEY" && exit 1)

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.VPS_PORT || '22' }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Prepare app directory on VPS
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR || '/opt/binance-square-autopost-service' }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "VPS_APP_DIR='$VPS_APP_DIR' bash -s" <<'REMOTE'
          set -euo pipefail
          APP_DIR="${VPS_APP_DIR:-/opt/binance-square-autopost-service}"
          SUDO=""
          if [ "$(id -u)" -ne 0 ]; then SUDO="sudo"; fi

          if ! command -v git >/dev/null 2>&1; then
            if command -v apt-get >/dev/null 2>&1; then $SUDO apt-get update && $SUDO apt-get install -y git curl ca-certificates;
            elif command -v yum >/dev/null 2>&1; then $SUDO yum install -y git curl ca-certificates;
            else echo "Please install git/curl first"; exit 1; fi
          fi

          if ! command -v docker >/dev/null 2>&1; then
            curl -fsSL https://get.docker.com -o /tmp/get-docker.sh
            $SUDO sh /tmp/get-docker.sh
          fi
          $SUDO systemctl enable --now docker >/dev/null 2>&1 || true

          $SUDO mkdir -p "$APP_DIR"
          $SUDO chown -R "$(id -un):$(id -gn)" "$APP_DIR"
          if [ ! -d "$APP_DIR/.git" ]; then
            git clone https://github.com/${{ github.repository }}.git "$APP_DIR"
          else
            git -C "$APP_DIR" fetch origin main
            git -C "$APP_DIR" reset --hard origin/main
          fi
          mkdir -p "$APP_DIR/data"
          # The app container runs as the node user (uid/gid 1000) and writes runtime JSON files here.
          $SUDO chown -R 1000:1000 "$APP_DIR/data"
          if [ ! -f "$APP_DIR/.env" ]; then
            cp "$APP_DIR/.env.docker.example" "$APP_DIR/.env"
            chmod 600 "$APP_DIR/.env"
            echo "Created $APP_DIR/.env from .env.docker.example. Edit it on the VPS, then rerun this workflow."
          fi
          REMOTE

      - name: Start or update service
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR || '/opt/binance-square-autopost-service' }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "VPS_APP_DIR='$VPS_APP_DIR' bash -s" <<'REMOTE'
          set -euo pipefail
          APP_DIR="${VPS_APP_DIR:-/opt/binance-square-autopost-service}"
          cd "$APP_DIR"
          docker compose up -d --build
          docker compose ps
          docker image prune -f >/dev/null 2>&1 || true
          set -a
          [ -f .env ] && . ./.env
          set +a
          curl -fsS "http://127.0.0.1:${HOST_PORT:-8787}/health" || curl -fsS http://127.0.0.1:8787/health
          REMOTE
