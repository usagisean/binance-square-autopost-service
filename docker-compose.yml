services:
  app:
    build:
      context: .
    image: binance-square-autopost-service:local
    container_name: binance-square-autopost-service
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: 8787
    ports:
      # Bind to localhost by default; put Caddy/Nginx in front for HTTPS/domain.
      - "127.0.0.1:${HOST_PORT:-8787}:8787"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:'+(process.env.PORT||8787)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s


  caddy:
    image: caddy:2-alpine
    container_name: binance-square-autopost-caddy
    restart: unless-stopped
    profiles:
      - caddy
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
